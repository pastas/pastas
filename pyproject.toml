[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pastas"
dynamic = ["version"]
description = "Pastas is an open-source Python framework for the analysis of groundwater time series."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Collenteur et al. 2019" }]
maintainers = [
    { name = "R.A. Collenteur", email = "raoulcollenteur@gmail.com" },
    { name = "M. Bakker", email = "markbak@gmail.com" },
    { name = "R. Calje", email = "r.calje@artesia-water.nl" },
    { name = "F. Schaars", email = "f.schaars@artesia-water.nl" },
    { name = "D.A. Brakenhoff", email = "d.brakenhoff@artesia-water.nl" },
    { name = "O.N. Ebbens", email = "o.ebbens@artesia-water.nl" },
    { name = "M.A. Vonk", email = "vonk.mart@gmail.com" },
]
requires-python = ">= 3.11, < 3.15"
dependencies = [
    "numpy >= 2.0.0, < 3.0",
    "matplotlib >= 3.9.0, < 4.0",
    "pandas >= 2.2.0, < 4.0",
    "scipy >= 1.16.0, < 2.0",
    "numba >= 0.60.0, < 1.0",
]
keywords = ["hydrology", "groundwater", "timeseries", "analysis"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Other Audience',
    'Topic :: Scientific/Engineering :: Hydrology',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

[project.urls]
homepage = "https://pastas.dev"
repository = "https://github.com/pastas/pastas"
documentation = "https://pastas.readthedocs.io"
download = "https://pypi.org/project/pastas/"

[project.optional-dependencies]
solvers = ["lmfit >= 1.3.2", "emcee >= 3.1.5"]
interactive = ["bokeh >= 3.6", "plotly"]
datasets = ["requests"]
ruffing = ["ruff"]
formatting = ["pastas[ruffing]"]
linting = ["pastas[ruffing]"]
caching = ["cachetools"]
codespelling = ["codespell[toml]"]
mpmath = ["mpmath"]
full = ["pastas[solvers,interactive,datasets,caching,mpmath]"]
pytesting = ["pytest>=7", "pytest-cov", "pytest-sugar"]
ci = [
    "pastas[pytesting,solvers,interactive,caching,mpmath]",
    "jupyter",
    "coverage",
    "corner",
    "tqdm",
]
rtd = [
    "pastas[solvers]",
    "Ipython",
    "ipykernel",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinxcontrib-bibtex",
    "requests",
    "numpydoc",
    "sphinx-design",
    "myst_nb",
    "sphinx-autoapi",
    "rtds_action",
]
dev = ["tox-uv", "pre-commit", "pastas[ruffing,codespelling,ci,rtd]"]

[dependency-groups]
dev = ["pastas[dev]"]

[tool.setuptools.dynamic]
version = { attr = "pastas.version.__version__" }

[tool.ruff]
extend-include = ["*.ipynb"]
show-fixes = true
fix = true

[tool.ruff.lint]
extend-select = ["I", "D"]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"doc/**/*.ipynb" = ["D"]
"doc/**/*.py" = ["D"]


[tool.pytest.ini_options]
addopts = "--strict-markers --durations=0"
markers = [
    "notebooks: run notebooks",
    "bnotebooks: run benchmark notebooks",
    "pasfiles: test pas file I/O between pastas versions",
]

[tool.codespell]
skip = "*.pdf,*.csv,*.txt,*.lock"
ignore-regex = "[A-Za-z0-9+/]{100,}"                           # base64-encoded data in *.ipynb files
ignore-words-list = ["delt", "te", "theses", "Bilt", "Strack"]

[tool.tox]
requires = ["tox-uv>=1.0"]
package = "wheel"
env_list = ["py310", "py311", "py312", "py313", "py314", "ruff", "notebooks"]

[tool.tox.env_run_base]
description = "run unit tests"
extras = ["ci"]
commands = [
    [
        "pytest",
        "tests",
        "-m",
        "not notebooks and not bnotebooks and not pasfiles",
    ],
]

[tool.tox.env.all]
description = "run all unit tests (excluding notebooks)"
extras = ["ci"]
commands = [
    [
        "coverage",
        "run",
        "-m",
        "pytest",
        "tests",
        "-m",
        "not notebooks and not bnotebooks and not pasfiles",
    ],
    [
        "coverage",
        "json",
    ],
]

[tool.tox.env.pasfiles]
description = "test pas file I/O between pastas versions"
extras = ["ci"]
commands = [["pytest", "tests", "-m", "pasfiles"]]

[tool.tox.env.notebooks]
description = "run the benchmark notebooks"
extras = ["ci"]
commands = [["pytest", "tests", "-m", "bnotebooks"]]

[tool.tox.env.execute_notebooks]
description = "run the example notebooks"
extras = ["ci"]
commands = [
    ["pytest", "tests", "-m", "notebooks"],
]

[tool.tox.env.ruff]
description = "run ruff checks"
extras = ["ruffing"]
commands = [
    [
        "ruff",
        "check",
        "--extend-select",
        "I",
    ],
    [
        "ruff",
        "format",
        "--check",
    ],
]

[tool.tox.env.ruff_preview]
description = "run ruff checks preview mode"
extras = ["ruffing"]
commands = [
    [
        "ruff",
        "check",
        "--extend-select",
        "I",
        "--preview",
        "--exit-zero",
    ],
]

[tool.tox.env.codespell]
description = "run spelling checks"
extras = ["codespelling"]
commands = [["codespell"]]
