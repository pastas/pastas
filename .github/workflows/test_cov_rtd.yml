name: CI COV_RTD

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
            - dev

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-cov-rtd:
        name: Run All Tests, Coverage & RTD
        runs-on: ubuntu-latest
        env:
            BADGE_GIST_COVERAGE_TOKEN: ${{ secrets.BADGE_GIST_COVERAGE_TOKEN }}
            CI_PASFILES: "0"
            FORCE_COLOR: "1"
            PY_COLORS: "1"
            PYTEST_ADDOPTS: "--color=yes"

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up uv with Python 3.13
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  uv venv
                  uv pip install tox-uv

            # Single tox step running unit tests, notebooks, and generating coverage.json
            - name: Run All Tests & Notebooks
              run: uv run tox -e all

            - name: Export Coverage Percent
              id: coverage
              run: |
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  data = json.loads(Path("coverage.json").read_text())
                  coverage = data["totals"]["percent_covered_display"]
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
                      fh.write(f"coverage={coverage}\n")
                  PY

            - name: Update Coverage Badge
              if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.BADGE_GIST_COVERAGE_TOKEN != ''
              uses: Schneegans/dynamic-badges-action@v1.7.0
              with:
                  auth: ${{ env.BADGE_GIST_COVERAGE_TOKEN }}
                  gistID: "02bcb92e1d487ffc9143752296b8db72"
                  filename: coverage.json
                  label: coverage
                  message: ${{ steps.coverage.outputs.coverage }}%

            - name: Upload Executed Notebooks Artifact
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: actions/upload-artifact@v4
              with:
                  name: notebooks-for-${{ github.sha }}
                  path: doc/

            - name: Trigger Read the Docs Build
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: dfm/rtds-action@v1
              with:
                  webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
                  webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
                  commit_ref: ${{ github.ref }}
