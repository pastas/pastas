name: CI PASFILES

on:
  # Trigger the workflow on direct push on master and dev,
  # and on pull-requests targeting dev
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  # Group by workflow name and ref (branch or pull request ref).
  # For pushes the ref is the branch (refs/heads/<branch>).
  # For PR events the ref is refs/pull/<number>/merge — same across commits for that PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_pasfiles:
    name: Test suite for .pas files
    runs-on: ubuntu-latest
    env:
      CI_PASFILES: "1" # generate pas files for these tests
      # Color Output
      # Rich (pip)
      FORCE_COLOR: 1
      # Tox
      PY_COLORS: 1
      # Pytest
      PYTEST_ADDOPTS: "--color=yes"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: |
          uv venv
          uv pip install tox-uv

      - name: Setup tox environment
        run: uv run tox -e pasfiles --notest

      - name: Test
        run: uv run tox -e pasfiles --skip-pkg-install
